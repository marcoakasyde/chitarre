<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo Chitarre - QuintaDB</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #00adb5;
      --text: #eeeeee;
      --text-muted: #aaaaaa;
      --border: #333333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    h1 { color: var(--accent); }
    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 600px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: #222;
      color: #fff;
    }
    button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background-color: var(--accent);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .stats-bar {
      display: flex;
      gap: 15px;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .stat-item { flex: 1; min-width: 120px; }
    .stat-label { font-size: 0.8em; color: var(--text-muted); }
    .stat-value { font-size: 1.2em; font-weight: bold; margin-top: 5px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #000;
    }
    .card-body {
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-title { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; }
    .card-details { font-size: 0.9em; color: var(--text-muted); line-height: 1.5; }
    .status { margin-top: 10px; margin-bottom: 15px; font-size: 0.85em; color: var(--accent); }
    .error { color: #ff5252; }
  </style>
</head>
<body>

  <header>
    <h1>🎸 Catalogo Chitarre</h1>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Cerca modello..." oninput="filterRecords()">
      <button onclick="loadData()">Aggiorna da QuintaDB</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-item"><div class="stat-label">Totale Strumenti</div><div class="stat-value" id="statCount">0</div></div>
    <div class="stat-item"><div class="stat-label">Totale Costi</div><div class="stat-value" id="statCost">€0</div></div>
    <div class="stat-item"><div class="stat-label">Totale Spese</div><div class="stat-value" id="statExpenses">€0</div></div>
    <div class="stat-item"><div class="stat-label">Totale Vendite</div><div class="stat-value" id="statSales">€0</div></div>
    <div class="stat-item"><div class="stat-label">Guadagno Netto</div><div class="stat-value" id="statProfit" style="color:#4caf50;">€0</div></div>
  </div>

  <div id="statusMessage" class="status">Inizializzazione...</div>

  <div class="grid" id="recordsGrid"></div>

  <script>
    const CONFIG = {
      appId: "dcGmkqWQ5cTQ_cUmk4WPDM",
      entityId: "bvfSocbxXcLOkOtNj0rmow",
      apiKey: "a4WQ_dNCnmWQfUWPpcTCol",
      photoFieldId: "cfWRGLWRjcMioaCSknbCov"
    };

    let allRecords = [];

    function mapQuintaRecord(rec) {
      const v = rec.values || {};
      const foto = v[CONFIG.photoFieldId] || "";
      const costo = Number(v.aNW7xcKWTdKOzIW4_cRhLd) || 0;
      const spese = Number(v.c8F8owWR1lW5ZcG3HqWO1w) || 0;
      const prezzoVendita = Number(v.c9waTammngW59eWOldL8o6) || 0;

      let guadagno = 0;
      if (v.aLmSkLiSjhziome8ordmkO !== undefined && v.aLmSkLiSjhziome8ordmkO !== "") {
        guadagno = Number(v.aLmSkLiSjhziome8ordmkO);
      } else {
        guadagno = prezzoVendita - costo - spese;
      }

      return {
        id: rec.id,
        modello: v.dcTtpdSmnfW4JcGgBdJrns || "Modello sconosciuto",
        data: v.cEkfhdKSjoAPL6ebxcJdCy || "-",
        costo,
        spese,
        prezzo_vendita: prezzoVendita,
        guadagno,
        foto_nome: foto,
        foto_quinta: foto
          ? `https://quintadb.com/images/data4/${CONFIG.photoFieldId}/${rec.id}/${encodeURIComponent(foto)}`
          : "",
        foto_locale: foto
          ? `images/${encodeURIComponent(foto)}`
          : ""
      };
    }

    async function loadData() {
      const statusEl = document.getElementById("statusMessage");
      statusEl.className = "status";
      statusEl.innerText = "Caricamento dati da QuintaDB in corso...";

      const targetUrl = `https://quintadb.com/apps/${CONFIG.appId}/dtypes/entity/${CONFIG.entityId}.json?rest_api_key=${CONFIG.apiKey}&page=1`;

      const endpoints = [
        targetUrl,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
      ];

      let data = null;
      let success = false;

      for (const url of endpoints) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            data = await res.json();
            if (data && Array.isArray(data.records)) {
              success = true;
              break;
            }
          }
        } catch (e) {
          console.warn("Chiamata fallita su: " + url, e);
        }
      }

      if (success && data.records) {
        allRecords = data.records.map(mapQuintaRecord);
        statusEl.innerText = `Caricati con successo ${allRecords.length} record!`;
        renderGrid(allRecords);
      } else {
        statusEl.className = "status error";
        statusEl.innerText = "Errore nel caricamento dei dati da QuintaDB (Verifica CORS o permessi API).";
      }
    }

    function renderGrid(records) {
      const grid = document.getElementById("recordsGrid");
      grid.innerHTML = "";

      let totCost = 0, totExpenses = 0, totSales = 0, totProfit = 0;

      records.forEach(r => {
        totCost += r.costo;
        totExpenses += r.spese;
        totSales += r.prezzo_vendita;
        totProfit += r.guadagno;

        const card = document.createElement("div");
        card.className = "card";

        const imgTag = r.foto_quinta
          ? `<img
               src="${r.foto_quinta}"
               data-local="${r.foto_locale}"
               class="card-img"
               alt="${r.modello}"
               onerror="if(!this.dataset.triedLocal && this.dataset.local){ this.dataset.triedLocal='1'; this.src=this.dataset.local; } else { this.replaceWith(Object.assign(document.createElement('div'), { className:'card-img', style:'display:flex;align-items:center;justify-content:center;color:#777;font-size:0.8em;padding:10px;text-align:center;', textContent:'Foto non caricata: ' + ${JSON.stringify(r.foto_nome || '')} })); }"
             >`
          : `<div class="card-img" style="display:flex;align-items:center;justify-content:center;color:#555;">Nessuna Foto</div>`;

        card.innerHTML = `
          ${imgTag}
          <div class="card-body">
            <div class="card-title">${r.modello}</div>
            <div class="card-details">
              <strong>Data:</strong> ${r.data}<br>
              <strong>Costo:</strong> €${r.costo}<br>
              <strong>Spese:</strong> €${r.spese}<br>
              <strong>Vendita:</strong> €${r.prezzo_vendita}<br>
              <strong style="color:${r.guadagno >= 0 ? '#4caf50' : '#ff5252'}">Guadagno:</strong> €${r.guadagno}
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById("statCount").innerText = records.length;
      document.getElementById("statCost").innerText = `€${totCost}`;
      document.getElementById("statExpenses").innerText = `€${totExpenses}`;
      document.getElementById("statSales").innerText = `€${totSales}`;
      document.getElementById("statProfit").innerText = `€${totProfit}`;
    }

    function filterRecords() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allRecords.filter(r => r.modello.toLowerCase().includes(query));
      renderGrid(filtered);
    }

    window.onload = loadData;
  </script>
</body>
</html>
