<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catalogo Chitarre - QuintaDB</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --accent: #00adb5;
      --text: #eeeeee;
      --text-muted: #aaaaaa;
      --border: #333333;
      --danger: #c93b3b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      padding: 20px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 15px;
    }
    h1 { color: var(--accent); }
    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      max-width: 720px;
      flex-wrap: wrap;
    }
    input[type="text"], input[type="number"], input[type="file"] {
      padding: 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: #222;
      color: #fff;
    }
    .controls input[type="text"] {
      flex: 1;
      min-width: 180px;
    }
    button {
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      background-color: var(--accent);
      color: #fff;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { opacity: 0.9; }
    .btn-secondary {
      background-color: #2f3542;
      border: 1px solid var(--border);
    }
    .btn-danger-ghost {
      background-color: transparent;
      color: #ff6b6b;
      border: 1px solid rgba(255, 107, 107, 0.35);
    }
    .btn-danger-ghost:hover {
      background-color: rgba(201, 59, 59, 0.16);
    }
    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .btn-small {
      padding: 6px 10px;
      font-size: 0.82em;
    }
    .stats-bar {
      display: flex;
      gap: 15px;
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .stat-item { flex: 1; min-width: 120px; }
    .stat-label { font-size: 0.8em; color: var(--text-muted); }
    .stat-value { font-size: 1.2em; font-weight: bold; margin-top: 5px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
    }
    .card-img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      background: #000;
    }
    img.card-img {
      cursor: zoom-in;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }
    img.card-img:hover {
      opacity: 0.92;
      transform: scale(1.02);
    }
    .card-body {
      padding: 15px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .card-title { font-size: 1.1em; font-weight: bold; margin-bottom: 10px; }
    .card-details { font-size: 0.9em; color: var(--text-muted); line-height: 1.5; }
    .status { margin-top: 10px; margin-bottom: 15px; font-size: 0.85em; color: var(--accent); }
    .error { color: #ff5252; }

    /* Modale ingrandimento foto */
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .lightbox.open { display: flex; }
    .lightbox-content {
      position: relative;
      max-width: 92vw;
      max-height: 90vh;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .lightbox-img {
      max-width: 100%;
      max-height: 76vh;
      object-fit: contain;
      border-radius: 6px;
      background: #000;
    }
    .lightbox-caption {
      font-size: 0.95em;
      color: var(--text);
      text-align: center;
      word-break: break-word;
    }
    .lightbox-close {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.75);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 1.2em;
      line-height: 1;
    }

    /* Modale form inserimento/modifica */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      z-index: 950;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .form-modal {
      width: 100%;
      max-width: 460px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      max-height: 92vh;
      overflow-y: auto;
    }
    .form-modal h2 {
      color: var(--accent);
      margin-bottom: 15px;
      font-size: 1.2em;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 0.85em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .form-group input {
      width: 100%;
    }
    .hint {
      display: block;
      font-size: 0.78em;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .form-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .form-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      flex-wrap: wrap;
    }
    .form-actions-right {
      display: flex;
      gap: 10px;
      margin-left: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>🎸 Catalogo Chitarre</h1>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Cerca modello..." oninput="filterRecords()">
      <button onclick="openRecordModal()">+ Nuovo Record</button>
      <button class="btn-secondary" onclick="loadData()">Aggiorna da QuintaDB</button>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-item"><div class="stat-label">Totale Strumenti</div><div class="stat-value" id="statCount">0</div></div>
    <div class="stat-item"><div class="stat-label">Totale Costi</div><div class="stat-value" id="statCost">€0</div></div>
    <div class="stat-item"><div class="stat-label">Totale Spese</div><div class="stat-value" id="statExpenses">€0</div></div>
    <div class="stat-item"><div class="stat-label">Totale Vendite</div><div class="stat-value" id="statSales">€0</div></div>
    <div class="stat-item"><div class="stat-label">Guadagno Netto</div><div class="stat-value" id="statProfit" style="color:#4caf50;">€0</div></div>
  </div>

  <div id="statusMessage" class="status">Inizializzazione...</div>

  <div class="grid" id="recordsGrid"></div>

  <!-- Modale inserimento / modifica record -->
  <div id="recordModal" class="modal-backdrop" onclick="handleFormBackdrop(event)">
    <div class="form-modal">
      <h2 id="formModalTitle">Nuovo Record su QuintaDB</h2>
      <form id="recordForm" onsubmit="saveRecord(event)">
        <input type="hidden" id="recId">

        <div class="form-group">
          <label for="recModello">Modello</label>
          <input type="text" id="recModello" required placeholder="Es. Fender Stratocaster">
        </div>

        <div class="form-group">
          <label for="recData">Data (GG-MM-AAAA)</label>
          <input type="text" id="recData" placeholder="24-11-2026">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="recCosto">Costo (€)</label>
            <input type="number" id="recCosto" step="any" value="0" oninput="updateGuadagnoPreview()">
          </div>
          <div class="form-group">
            <label for="recSpese">Spese (€)</label>
            <input type="number" id="recSpese" step="any" value="0" oninput="updateGuadagnoPreview()">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="recVendita">Prezzo Vendita (€)</label>
            <input type="number" id="recVendita" step="any" value="0" oninput="updateGuadagnoPreview()">
          </div>
          <div class="form-group">
            <label for="recGuadagno">Guadagno (€)</label>
            <input type="number" id="recGuadagno" step="any" value="0">
          </div>
        </div>

        <div class="form-group">
          <label for="recFotoFile">Carica Foto (JPG / PNG / WEBP)</label>
          <input type="file" id="recFotoFile" accept="image/*">
          <span class="hint" id="currentFotoHint"></span>
        </div>

        <div class="form-group">
          <label for="recFoto">Nome file foto su QuintaDB (opzionale)</label>
          <input type="text" id="recFoto" placeholder="Lascia vuoto se carichi un file sopra">
        </div>

        <div class="form-actions">
          <button type="button" id="deleteInModalBtn" class="btn-danger-ghost btn-small" style="display:none;" onclick="deleteCurrentRecord()">Elimina record</button>
          <div class="form-actions-right">
            <button type="button" class="btn-secondary" onclick="closeRecordModal()">Annulla</button>
            <button type="submit" id="saveRecordBtn">Salva su QuintaDB</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- Modale ingrandimento foto -->
  <div id="lightbox" class="lightbox" onclick="handleLightboxBackdrop(event)">
    <div class="lightbox-content">
      <button class="lightbox-close" onclick="closeLightbox()" title="Chiudi">&times;</button>
      <img id="lightboxImg" class="lightbox-img" src="" alt="">
      <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>
  </div>

  <script>
    const CONFIG = {
      appId: "dcGmkqWQ5cTQ_cUmk4WPDM",
      entityId: "bvfSocbxXcLOkOtNj0rmow",
      apiKey: "a4WQ_dNCnmWQfUWPpcTCol",
      photoFieldId: "cfWRGLWRjcMioaCSknbCov",
      fields: {
        modello: "dcTtpdSmnfW4JcGgBdJrns",
        data: "cEkfhdKSjoAPL6ebxcJdCy",
        costo: "aNW7xcKWTdKOzIW4_cRhLd",
        spese: "c8F8owWR1lW5ZcG3HqWO1w",
        vendita: "c9waTammngW59eWOldL8o6",
        guadagno: "aLmSkLiSjhziome8ordmkO",
        foto: "cfWRGLWRjcMioaCSknbCov"
      }
    };

    let allRecords = [];

    function generateQuintaId() {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-";
      const arr = new Uint8Array(22);
      crypto.getRandomValues(arr);
      let out = "";
      for (let i = 0; i < arr.length; i++) {
        out += chars[arr[i] % chars.length];
      }
      return out;
    }

    function todayFormatted() {
      const d = new Date();
      const dd = String(d.getDate()).padStart(2, "0");
      const mm = String(d.getMonth() + 1).padStart(2, "0");
      const yyyy = d.getFullYear();
      return `${dd}-${mm}-${yyyy}`;
    }

    function mapQuintaRecord(rec) {
      const v = rec.values || {};
      const foto = v[CONFIG.fields.foto] || "";
      const costo = Number(v[CONFIG.fields.costo]) || 0;
      const spese = Number(v[CONFIG.fields.spese]) || 0;
      const prezzoVendita = Number(v[CONFIG.fields.vendita]) || 0;

      let guadagno = 0;
      if (v[CONFIG.fields.guadagno] !== undefined && v[CONFIG.fields.guadagno] !== "") {
        guadagno = Number(v[CONFIG.fields.guadagno]);
      } else {
        guadagno = prezzoVendita - costo - spese;
      }

      return {
        id: rec.id,
        modello: v[CONFIG.fields.modello] || "Modello sconosciuto",
        data: v[CONFIG.fields.data] || "-",
        costo,
        spese,
        prezzo_vendita: prezzoVendita,
        guadagno,
        foto_nome: foto,
        foto_quinta: foto
          ? `https://quintadb.com/images/data4/${CONFIG.photoFieldId}/${rec.id}/${encodeURIComponent(foto)}`
          : "",
        foto_locale: foto
          ? `images/${encodeURIComponent(foto)}`
          : ""
      };
    }

    async function fetchWithFallback(targetUrl, options = {}) {
      const candidates = [
        targetUrl,
        `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`,
        `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`
      ];

      let lastError = null;
      for (const url of candidates) {
        try {
          const res = await fetch(url, options);
          if (res.ok) {
            const text = await res.text();
            if (!text) return {};
            try {
              return JSON.parse(text);
            } catch (_) {
              return { raw: text };
            }
          }
          lastError = new Error(`HTTP ${res.status} (${url})`);
        } catch (err) {
          lastError = err;
        }
      }
      throw lastError || new Error("Richiesta fallita");
    }

    async function uploadFotoToQuinta(file, dtypeId) {
      const uploadUrl = `https://quintadb.com/entities/${encodeURIComponent(CONFIG.appId)}/upload_file/${encodeURIComponent(CONFIG.photoFieldId)}.json?dtype_id=${encodeURIComponent(dtypeId)}`;
      const formData = new FormData();
      formData.append("rest_api_key", CONFIG.apiKey);
      formData.append("app_id", CONFIG.appId);
      formData.append("dtype_id", dtypeId);
      formData.append("filedata", file, file.name);

      return await fetchWithFallback(uploadUrl, {
        method: "POST",
        body: formData
      });
    }

    async function loadData() {
      const statusEl = document.getElementById("statusMessage");
      statusEl.className = "status";
      statusEl.innerText = "Caricamento dati da QuintaDB in corso...";

      const targetUrl = `https://quintadb.com/apps/${CONFIG.appId}/dtypes/entity/${CONFIG.entityId}.json?rest_api_key=${encodeURIComponent(CONFIG.apiKey)}&page=1`;

      try {
        const data = await fetchWithFallback(targetUrl);
        if (data && Array.isArray(data.records)) {
          allRecords = data.records.map(mapQuintaRecord);
          statusEl.innerText = `Caricati con successo ${allRecords.length} record!`;
          renderGrid(allRecords);
        } else {
          throw new Error("Formato JSON non valido");
        }
      } catch (e) {
        console.warn("Errore caricamento:", e);
        statusEl.className = "status error";
        statusEl.innerText = "Errore nel caricamento dei dati da QuintaDB (Verifica CORS o permessi API).";
      }
    }

    function openRecordModal(recordId = null) {
      const modal = document.getElementById("recordModal");
      const title = document.getElementById("formModalTitle");
      const fileInput = document.getElementById("recFotoFile");
      const hintEl = document.getElementById("currentFotoHint");
      const deleteBtn = document.getElementById("deleteInModalBtn");
      fileInput.value = "";

      if (recordId) {
        const rec = allRecords.find(r => r.id === recordId);
        if (!rec) return;
        title.innerText = "Modifica Record su QuintaDB";
        document.getElementById("recId").value = rec.id;
        document.getElementById("recFoto").value = rec.foto_nome || "";
        document.getElementById("recModello").value = rec.modello === "Modello sconosciuto" ? "" : rec.modello;
        document.getElementById("recData").value = rec.data === "-" ? todayFormatted() : rec.data;
        document.getElementById("recCosto").value = rec.costo;
        document.getElementById("recSpese").value = rec.spese;
        document.getElementById("recVendita").value = rec.prezzo_vendita;
        document.getElementById("recGuadagno").value = rec.guadagno;
        hintEl.textContent = rec.foto_nome ? `Foto attuale: ${rec.foto_nome}` : "Nessuna foto associata";
        deleteBtn.style.display = "inline-block";
      } else {
        title.innerText = "Nuovo Record su QuintaDB";
        document.getElementById("recId").value = "";
        document.getElementById("recFoto").value = "";
        document.getElementById("recModello").value = "";
        document.getElementById("recData").value = todayFormatted();
        document.getElementById("recCosto").value = 0;
        document.getElementById("recSpese").value = 0;
        document.getElementById("recVendita").value = 0;
        document.getElementById("recGuadagno").value = 0;
        hintEl.textContent = "Seleziona un'immagine per caricarla su QuintaDB";
        deleteBtn.style.display = "none";
      }

      modal.classList.add("open");
    }

    function closeRecordModal() {
      document.getElementById("recordModal").classList.remove("open");
    }

    function handleFormBackdrop(event) {
      if (event.target.id === "recordModal") {
        closeRecordModal();
      }
    }

    function updateGuadagnoPreview() {
      const costo = Number(document.getElementById("recCosto").value) || 0;
      const spese = Number(document.getElementById("recSpese").value) || 0;
      const vendita = Number(document.getElementById("recVendita").value) || 0;
      document.getElementById("recGuadagno").value = vendita - costo - spese;
    }

    async function saveRecord(event) {
      event.preventDefault();
      const statusEl = document.getElementById("statusMessage");
      const saveBtn = document.getElementById("saveRecordBtn");

      const existingId = document.getElementById("recId").value.trim();
      const targetRecordId = existingId || generateQuintaId();
      const modello = document.getElementById("recModello").value.trim();
      const dataVal = document.getElementById("recData").value.trim();
      const costo = Number(document.getElementById("recCosto").value) || 0;
      const spese = Number(document.getElementById("recSpese").value) || 0;
      const vendita = Number(document.getElementById("recVendita").value) || 0;
      const guadagno = Number(document.getElementById("recGuadagno").value) || 0;
      const fileInput = document.getElementById("recFotoFile");
      const selectedFile = fileInput && fileInput.files && fileInput.files[0] ? fileInput.files[0] : null;
      let foto = document.getElementById("recFoto").value.trim();

      saveBtn.disabled = true;
      statusEl.className = "status";

      try {
        if (selectedFile) {
          statusEl.innerText = "Caricamento immagine su QuintaDB...";
          const uploadRes = await uploadFotoToQuinta(selectedFile, targetRecordId);
          foto = (uploadRes && (uploadRes.file_name || uploadRes.filename || uploadRes.name)) || selectedFile.name;
        }

        const valuesPayload = {
          [CONFIG.fields.modello]: modello,
          [CONFIG.fields.data]: dataVal,
          [CONFIG.fields.costo]: String(costo),
          [CONFIG.fields.spese]: String(spese),
          [CONFIG.fields.vendita]: String(vendita),
          [CONFIG.fields.guadagno]: guadagno
        };

        if (foto) {
          valuesPayload[CONFIG.fields.foto] = foto;
        }

        let endpoint = "";
        let method = "POST";

        if (existingId) {
          method = "PUT";
          endpoint = `https://quintadb.com/apps/${CONFIG.appId}/dtypes/${encodeURIComponent(existingId)}.json`;
        } else {
          method = "POST";
          valuesPayload.entity_id = CONFIG.entityId;
          valuesPayload.id = targetRecordId;
          endpoint = `https://quintadb.com/apps/${CONFIG.appId}/dtypes.json`;
        }

        const body = JSON.stringify({
          rest_api_key: CONFIG.apiKey,
          values: valuesPayload
        });

        statusEl.innerText = existingId ? "Aggiornamento record su QuintaDB..." : "Inserimento nuovo record su QuintaDB...";

        await fetchWithFallback(endpoint, {
          method,
          headers: { "Content-Type": "application/json" },
          body
        });

        closeRecordModal();
        await loadData();
        statusEl.className = "status";
        statusEl.innerText = existingId ? "Record aggiornato su QuintaDB!" : "Nuovo record salvato su QuintaDB!";
      } catch (err) {
        console.error("Errore salvataggio QuintaDB:", err);
        statusEl.className = "status error";
        statusEl.innerText = `Salvataggio non riuscito (${err.message}). Verifica permessi API o supporto del proxy per upload/scrittura.`;
      } finally {
        saveBtn.disabled = false;
      }
    }

    async function deleteCurrentRecord() {
      const recordId = document.getElementById("recId").value.trim();
      const modello = document.getElementById("recModello").value.trim();
      if (!recordId) return;

      const confirmed = confirm(`Vuoi davvero eliminare "${modello || "questo record"}" da QuintaDB?`);
      if (!confirmed) return;

      const statusEl = document.getElementById("statusMessage");
      const deleteBtn = document.getElementById("deleteInModalBtn");
      deleteBtn.disabled = true;
      statusEl.className = "status";
      statusEl.innerText = "Eliminazione record da QuintaDB...";

      const deleteUrlWithKey = `https://quintadb.com/apps/${encodeURIComponent(CONFIG.appId)}/dtypes/${encodeURIComponent(recordId)}.json?rest_api_key=${encodeURIComponent(CONFIG.apiKey)}`;

      try {
        await fetchWithFallback(deleteUrlWithKey, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ rest_api_key: CONFIG.apiKey })
        });
        closeRecordModal();
        await loadData();
        statusEl.className = "status";
        statusEl.innerText = "Record eliminato da QuintaDB!";
      } catch (err) {
        console.error("Errore eliminazione QuintaDB:", err);
        statusEl.className = "status error";
        statusEl.innerText = `Eliminazione non riuscita (${err.message}). Verifica permessi DELETE della chiave API o del proxy.`;
      } finally {
        deleteBtn.disabled = false;
      }
    }

    function openLightboxFromImg(imgEl) {
      if (!imgEl || !imgEl.currentSrc) return;
      const lightbox = document.getElementById("lightbox");
      const lbImg = document.getElementById("lightboxImg");
      const lbCaption = document.getElementById("lightboxCaption");

      lbImg.src = imgEl.currentSrc;
      lbImg.alt = imgEl.alt || "";
      lbCaption.textContent = imgEl.dataset.caption || imgEl.alt || "";
      lightbox.classList.add("open");
    }

    function closeLightbox() {
      const lightbox = document.getElementById("lightbox");
      const lbImg = document.getElementById("lightboxImg");
      lightbox.classList.remove("open");
      lbImg.src = "";
    }

    function handleLightboxBackdrop(event) {
      if (event.target.id === "lightbox") {
        closeLightbox();
      }
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeLightbox();
        closeRecordModal();
      }
    });

    function renderGrid(records) {
      const grid = document.getElementById("recordsGrid");
      grid.innerHTML = "";

      let totCost = 0, totExpenses = 0, totSales = 0, totProfit = 0;

      records.forEach(r => {
        totCost += r.costo;
        totExpenses += r.spese;
        totSales += r.prezzo_vendita;
        totProfit += r.guadagno;

        const card = document.createElement("div");
        card.className = "card";

        const captionText = `${r.modello}${r.data && r.data !== "-" ? " — " + r.data : ""}`;
        const safeModello = r.modello.replace(/"/g, "&quot;");

        const imgTag = r.foto_quinta
          ? `<img
               src="${r.foto_quinta}"
               data-local="${r.foto_locale}"
               data-caption="${captionText.replace(/"/g, "&quot;")}"
               class="card-img"
               alt="${safeModello}"
               onclick="openLightboxFromImg(this)"
               onerror="if(!this.dataset.triedLocal && this.dataset.local){ this.dataset.triedLocal='1'; this.src=this.dataset.local; } else { this.replaceWith(Object.assign(document.createElement('div'), { className:'card-img', style:'display:flex;align-items:center;justify-content:center;color:#777;font-size:0.8em;padding:10px;text-align:center;', textContent:'Foto non caricata: ' + ${JSON.stringify(r.foto_nome || '')} })); }"
             >`
          : `<div class="card-img" style="display:flex;align-items:center;justify-content:center;color:#555;">Nessuna Foto</div>`;

        card.innerHTML = `
          ${imgTag}
          <div class="card-body">
            <div>
              <div class="card-title">${r.modello}</div>
              <div class="card-details">
                <strong>Data:</strong> ${r.data}<br>
                <strong>Costo:</strong> €${r.costo}<br>
                <strong>Spese:</strong> €${r.spese}<br>
                <strong>Vendita:</strong> €${r.prezzo_vendita}<br>
                <strong style="color:${r.guadagno >= 0 ? '#4caf50' : '#ff5252'}">Guadagno:</strong> €${r.guadagno}
              </div>
            </div>
            <div class="card-actions">
              <button type="button" class="btn-secondary btn-small" data-id="${r.id}" onclick="openRecordModal(this.dataset.id)">Modifica</button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById("statCount").innerText = records.length;
      document.getElementById("statCost").innerText = `€${totCost}`;
      document.getElementById("statExpenses").innerText = `€${totExpenses}`;
      document.getElementById("statSales").innerText = `€${totSales}`;
      document.getElementById("statProfit").innerText = `€${totProfit}`;
    }

    function filterRecords() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = allRecords.filter(r => r.modello.toLowerCase().includes(query));
      renderGrid(filtered);
    }

    window.onload = loadData;
  </script>
</body>
</html>
